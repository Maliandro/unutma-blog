name: Generate Blog Posts

on:
  schedule:
    # Haftada 1 (Pazar 08:00 UTC). Onceden gunlukTU: bu hem LLM kotasini
    # bosa yakiyor hem de otorite kazanmamis bir sitede gunluk yapay
    # icerik uretmek SEO acisindan ZARARLI (ince icerik sinyali).
    # Kaliteli tek yazi > yedi doldurma yazisi.
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Remove duplicate posts
        working-directory: scripts
        run: python dedupe_posts.py

      - name: Generate blog posts
        working-directory: scripts
        run: python batch_generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blog): auto-generate posts"
          file_pattern: "src/content/blog/*.md scripts/keywords_used.txt scripts/topic_sources.txt"
